# The HTML edition of this book: GitHub Pages serves it at https://vsokolov.org/clinical_trials_in_practice/
# Made by htmlbook.py workflow from templates/quarto_pages.yml of the book-writing skill (references/publishing.md).
# The render uses the frozen results only (_freeze/), so nothing computes here: htmlbook.py plan says whether they are of the present text.
# One setting, with the authors' go-ahead: Pages source "GitHub Actions" (gh api -X POST repos/VadimSokolov/clinical_trials_in_practice/pages -f build_type=workflow).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.8.27

      - name: Render the book from its frozen results
        run: |
          printf 'execute:\n  freeze: true\n' > _quarto-htmlfreeze.yml
          quarto render --to html --profile htmlfreeze -M book-has-isbn:false

      - name: Offer the release PDF where the pages link to it
        run: |
          python3 - <<'PY'
          import os, re, shutil, urllib.parse
          out, pdf = '_book', os.path.join(os.environ['GITHUB_WORKSPACE'], 'pdf/clinical_trials_in_practice.pdf')
          with open(os.path.join(out, 'index.html'), encoding='utf-8') as f:
              page = f.read()
          for name in sorted(set(re.findall(r'href="\./([^"/]+\.pdf)"', page))):
              shutil.copyfile(pdf, os.path.join(out, urllib.parse.unquote(name)))
              print('release PDF served as', name)
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
